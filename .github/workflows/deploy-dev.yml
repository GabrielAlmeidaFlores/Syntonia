name: Deploy DEV

on:
  push:
    branches:
      - development

jobs:
  deploy:
    name: Deploy to DEV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # ── Backend ────────────────────────────────────────────────────
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck backend
        working-directory: backend
        run: npm run build

      - name: Deploy backend (DEV)
        working-directory: backend
        run: npx serverless@3 deploy --stage dev

      - name: Get backend CloudFormation outputs
        id: cf
        run: |
          STACK="syntonia-backend-dev"
          REGION="${{ vars.AWS_REGION }}"

          get_output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text \
              --region "$REGION"
          }

          echo "api_url=$(get_output ServiceEndpoint)"       >> $GITHUB_OUTPUT
          echo "user_pool_id=$(get_output UserPoolId)"       >> $GITHUB_OUTPUT
          echo "client_id=$(get_output UserPoolClientId)"    >> $GITHUB_OUTPUT

      # ── Frontend ───────────────────────────────────────────────────
      - name: Install Yarn Classic
        run: npm install -g yarn@1.22.22

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build frontend (DEV)
        working-directory: frontend
        env:
          VITE_API_URL: ${{ steps.cf.outputs.api_url }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.cf.outputs.user_pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.cf.outputs.client_id }}
          VITE_AWS_REGION: ${{ vars.VITE_AWS_REGION }}
        run: yarn build

      - name: Deploy frontend to Amplify (DEV)
        env:
          APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          BRANCH: dev
          REGION: ${{ vars.AWS_REGION }}
        run: |
          cd frontend/dist && zip -r /tmp/dist.zip . && cd -

          DEPLOY=$(aws amplify create-deployment \
            --app-id "$APP_ID" --branch-name "$BRANCH" \
            --region "$REGION" --output json)

          JOB_ID=$(echo "$DEPLOY" | python3 -c "import sys,json; print(json.load(sys.stdin)['jobId'])")
          UPLOAD_URL=$(echo "$DEPLOY" | python3 -c "import sys,json; print(json.load(sys.stdin)['zipUploadUrl'])")

          curl -s -o /dev/null -w "%{http_code}\n" \
            -X PUT -H "Content-Type: application/zip" \
            --data-binary @/tmp/dist.zip "$UPLOAD_URL"

          aws amplify start-deployment \
            --app-id "$APP_ID" --branch-name "$BRANCH" \
            --job-id "$JOB_ID" --region "$REGION"

          echo "Waiting for Amplify deployment..."
          for i in $(seq 1 30); do
            STATUS=$(aws amplify get-job \
              --app-id "$APP_ID" --branch-name "$BRANCH" --job-id "$JOB_ID" \
              --region "$REGION" --output json \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['job']['summary']['status'])")
            echo "[$i] $STATUS"
            if [ "$STATUS" = "SUCCEED" ]; then exit 0; fi
            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "Amplify deployment failed"; exit 1
            fi
            sleep 10
          done
          echo "Amplify deployment timed out"; exit 1
