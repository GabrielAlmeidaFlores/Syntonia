name: Deploy PRD

on:
  push:
    branches:
      - main

jobs:
  # ──────────────────────────────────────────────────────────────────
  typecheck-backend:
    name: Typecheck backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript type-check
        working-directory: backend
        run: npm run build

  # ──────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy backend (PRD)
    runs-on: ubuntu-latest
    needs: typecheck-backend
    outputs:
      api_url:      ${{ steps.cf.outputs.api_url }}
      user_pool_id: ${{ steps.cf.outputs.user_pool_id }}
      client_id:    ${{ steps.cf.outputs.client_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: Install dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Deploy with Serverless Framework
        working-directory: backend
        run: npx serverless@3 deploy --stage prod

      - name: Read CloudFormation outputs
        id: cf
        run: |
          STACK="syntonia-backend-prod"
          REGION="${{ vars.AWS_REGION }}"

          get_output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text \
              --region "$REGION"
          }

          API_ID=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK" \
            --logical-resource-id ApiGatewayRestApi \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text --region "$REGION")

          echo "api_url=https://${API_ID}.execute-api.${REGION}.amazonaws.com/prod" >> $GITHUB_OUTPUT
          echo "user_pool_id=$(get_output UserPoolId)"                               >> $GITHUB_OUTPUT
          echo "client_id=$(get_output UserPoolClientId)"                            >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build frontend (PRD)
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Yarn Classic
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL:               ${{ needs.deploy-backend.outputs.api_url }}
          VITE_COGNITO_USER_POOL_ID:  ${{ needs.deploy-backend.outputs.user_pool_id }}
          VITE_COGNITO_CLIENT_ID:     ${{ needs.deploy-backend.outputs.client_id }}
          VITE_AWS_REGION:            ${{ vars.VITE_AWS_REGION }}
        run: yarn build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-prod
          path: frontend/dist
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy frontend to Amplify (PRD)
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-prod
          path: dist

      - name: Create zip
        run: cd dist && zip -r /tmp/dist.zip .

      - name: Create Amplify deployment
        id: amplify
        env:
          APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          BRANCH: prod
          REGION: ${{ vars.AWS_REGION }}
        run: |
          DEPLOY=$(aws amplify create-deployment \
            --app-id "$APP_ID" --branch-name "$BRANCH" \
            --region "$REGION" --output json)
          echo "job_id=$(echo "$DEPLOY"    | python3 -c "import sys,json; print(json.load(sys.stdin)['jobId'])")"    >> $GITHUB_OUTPUT
          echo "upload_url=$(echo "$DEPLOY" | python3 -c "import sys,json; print(json.load(sys.stdin)['zipUploadUrl'])")" >> $GITHUB_OUTPUT

      - name: Upload build to S3 pre-signed URL
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            -X PUT -H "Content-Type: application/zip" \
            --data-binary @/tmp/dist.zip \
            "${{ steps.amplify.outputs.upload_url }}"

      - name: Start Amplify deployment
        env:
          APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          BRANCH: prod
          REGION: ${{ vars.AWS_REGION }}
        run: |
          aws amplify start-deployment \
            --app-id "$APP_ID" --branch-name "$BRANCH" \
            --job-id "${{ steps.amplify.outputs.job_id }}" \
            --region "$REGION"

      - name: Wait for deployment to complete
        env:
          APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          BRANCH: prod
          REGION: ${{ vars.AWS_REGION }}
        run: |
          for i in $(seq 1 30); do
            STATUS=$(aws amplify get-job \
              --app-id "$APP_ID" --branch-name "$BRANCH" \
              --job-id "${{ steps.amplify.outputs.job_id }}" \
              --region "$REGION" --output json \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['job']['summary']['status'])")
            echo "[$i] $STATUS"
            if [ "$STATUS" = "SUCCEED" ]; then break; fi
            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "Amplify deployment failed"; exit 1
            fi
            sleep 10
          done

  # ──────────────────────────────────────────────────────────────────
  seed-legal:
    name: Seed legal documents (first PRD deploy only)
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: Install dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Check if seed is needed
        id: check
        run: |
          COUNT=$(aws dynamodb scan \
            --table-name SintoniaLegal-prod \
            --select COUNT \
            --query Count \
            --output text \
            --region ${{ vars.AWS_REGION }})
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "SintoniaLegal-prod has $COUNT items"

      - name: Seed Terms and Privacy Policy
        if: steps.check.outputs.count == '0'
        working-directory: backend
        run: npx tsx scripts/seed-legal.ts prod

      - name: Skip (already seeded)
        if: steps.check.outputs.count != '0'
        run: echo "Table already has ${{ steps.check.outputs.count }} items — skipping seed."
